name: Deploy to Cloudflare

# Ships CODE on push. Predictions are computed live inside the Worker on its own
# race-weekend cron — this workflow does NOT touch them at runtime, it only
# (re)deploys the Worker + the static dashboard when the source changes.

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

# Avoid overlapping deploys if you push twice quickly.
concurrency:
  group: cf-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22   # wrangler 4 requires Node >= 22

      - name: Install Worker deps
        working-directory: cloudflare/worker
        run: npm install

      # Gate the deploy on the parity + harmony tests (champion=piastri, contract keys, etc).
      - name: Test (parity + harmony)
        working-directory: cloudflare/worker
        run: npm test

      # 1) Deploy the Worker (API + cron + KV binding from wrangler.toml).
      #    Uses the wrangler@4 already installed by the step above; wrangler reads
      #    CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID from the environment.
      - name: Deploy Worker
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # 2) Deploy the static dashboard to Cloudflare Pages (project "f1-2026" must
      #    already exist). Run from cloudflare/worker so wrangler is on hand; the
      #    dashboard lives two levels up.
      - name: Deploy Pages (dashboard)
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy ../../dashboard --project-name=f1-2026 --branch=main
